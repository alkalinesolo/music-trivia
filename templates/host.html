<!DOCTYPE html>
<html>
<head>
    <title>Music Trivia Host</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
            margin: 0;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #1db954;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #1ed760;
        }

        #players li {
            list-style: none;
            margin: 8px;
            font-size: 22px;
            display: inline-block;
            background: #222;
            padding: 5px 15px;
            border-radius: 20px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px auto;
            padding: 10px;
            background: white;
            width: 200px;
            height: 200px;
            border-radius: 10px;
        }

        .result {
            background: #222;
            padding: 15px;
            margin: 15px auto;
            width: 500px;
            border-radius: 10px;
            border-left: 5px solid #1db954;
            text-align: left;
        }

        .result h3 {
            margin: 0 0 5px 0;
            color: #1db954;
        }

        .result p {
            margin: 5px 0;
            font-size: 18px;
        }

        #lyric {
            font-size: 42px;
            margin: 40px auto;
            max-width: 80%;
            color: #f5f5f5;
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<h1>🎵 Music Trivia Host</h1>
<hr style="border-color: #333;">

<!-- ========================= -->
<!-- LOBBY SCREEN              -->
<!-- ========================= -->
<div id="lobby-view" class="game-phase">
    <h2>Room Code: <span id="active-room-code" style="color: #1db954;">Not set</span></h2>
    <div style="max-width: 360px; margin: 0 auto 20px auto;">
        <input
            type="text"
            id="room-code-input"
            placeholder="Enter room code..."
            maxlength="20"
            style="
                width: 100%;
                padding: 12px;
                border-radius: 8px;
                border: 2px solid #2f2f2f;
                background: #1b1b1b;
                color: #ffffff;
                box-sizing: border-box;
                font-size: 18px;
            "
        >
        <button onclick="setHostRoom()" style="width: 100%; margin-top: 10px;">Set Host Room</button>
    </div>
    <p>Scan to Join Game:</p>
    <div id="qrcode"></div>
    <p>
        <strong>Join URL:</strong>
        <a id="join-link" href="{{ join_url }}" style="color: #1db954;">{{ join_url }}</a>
    </p>
    
    <h2>Connected Players</h2>
    <ul id="players"></ul>
</div>

<!-- ========================= -->
<!-- GAMEPLAY VIEW             -->
<!-- ========================= -->
<div id="game-view" class="game-phase hidden">
    <h2 id="guessCount" style="color: #aaa;">Guesses: 0/0</h2>
    <h3 id="host-meta" style="color: #1db954;"></h3>
    <h1 id="lyric3" style="font-size: 34px;"></h1>
    <h2 id="lyric2" style="font-size: 28px; color: #ddd;"></h2>
    <h3 id="lyric1" style="font-size: 22px; color: #bbb;"></h3>
</div>

<!-- ========================= -->
<!-- RESULTS VIEW              -->
<!-- ========================= -->
<div id="results-view" class="game-phase hidden"></div>

<!-- ========================= -->
<!-- HOST CONTROLS             -->
<!-- ========================= -->
<div id="controls" style="margin-top: 40px;">
    <button id="btn-settings" onclick="openSettings()" style="background: #ff6b35; margin-bottom: 20px;">⚙️ Settings</button>
    <button id="btn-start" onclick="startRound()" disabled>Start Round</button>
    <button id="btn-results" onclick="showResults()" class="hidden">Show Results</button>
    <div id="host-timer" style="margin-top: 10px; color: #bdbdbd; font-size: 18px;">Time Left: --</div>
</div>

<!-- ========================= -->
<!-- SETTINGS MODAL            -->
<!-- ========================= -->
<div id="settings-modal" class="hidden" style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
">
    <div style="
        background: #222;
        padding: 30px;
        border-radius: 12px;
        border: 2px solid #1db954;
        max-height: 90vh;
        overflow-y: auto;
        max-width: 600px;
        width: 90%;
    ">
        <h2 style="margin-top: 0; color: #1db954;">Game Settings</h2>
        
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">
                Rounds Per Game:
            </label>
            <input 
                id="rounds-input" 
                type="number" 
                min="1" 
                max="20" 
                value="5"
                style="
                    width: 80px;
                    padding: 8px;
                    border-radius: 6px;
                    border: 2px solid #1db954;
                    background: #1b1b1b;
                    color: white;
                    font-size: 16px;
                "
            >
        </div>
        
        <div style="margin-bottom: 25px;">
            <h3 style="margin: 0 0 12px 0; color: #bbb;">Decades:</h3>
            <div id="decades-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <!-- Populated by JS -->
            </div>
        </div>
        
        <div style="margin-bottom: 25px;">
            <h3 style="margin: 0 0 12px 0; color: #bbb;">Genres:</h3>
            <div id="genres-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 250px; overflow-y: auto;">
                <!-- Populated by JS -->
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="closeSettings()" style="background: #666; flex: 1;">Cancel</button>
            <button onclick="saveSettings()" style="background: #1db954; flex: 1;">Save Settings</button>
        </div>
    </div>
</div>

<script>
const socket = io();
const baseJoinURL = "{{ join_url }}";
let activeRoomCode = "";
let hostCountdownInterval = null;
let hostRevealTimeouts = [];

const DECADES = ['1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'];
const GENRES = ['rock', 'pop', 'country', 'r&b', 'motown', 'hip hop', 'hip-hop', 'hip_hop_r_and_b', 'r_and_b_soul', 'reggae', 'grunge', 'alternative rock', 'soft rock', 'folk rock'];

let hostSettings = {
    rounds: 5,
    decades: new Set(DECADES),
    genres: new Set(GENRES)
};

const qrCode = new QRCode(document.getElementById("qrcode"), {
    text: baseJoinURL,
    width: 200,
    height: 200
});

function initializeSettingsUI() {
    const decadesContainer = document.getElementById('decades-container');
    DECADES.forEach(decade => {
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.cursor = 'pointer';
        label.innerHTML = `<input type="checkbox" class="decade-checkbox" value="${decade}" checked style="margin-right: 8px;"> ${decade}`;
        decadesContainer.appendChild(label);
    });

    const genresContainer = document.getElementById('genres-container');
    GENRES.forEach(genre => {
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.cursor = 'pointer';
        label.innerHTML = `<input type="checkbox" class="genre-checkbox" value="${genre}" checked style="margin-right: 8px;"> ${genre}`;
        genresContainer.appendChild(label);
    });
}

function openSettings() {
    document.getElementById('settings-modal').classList.remove('hidden');
    // Sync modal state with current settings
    document.getElementById('rounds-input').value = hostSettings.rounds;
    document.querySelectorAll('.decade-checkbox').forEach(cb => {
        cb.checked = hostSettings.decades.has(cb.value);
    });
    document.querySelectorAll('.genre-checkbox').forEach(cb => {
        cb.checked = hostSettings.genres.has(cb.value);
    });
}

function closeSettings() {
    document.getElementById('settings-modal').classList.add('hidden');
}

function saveSettings() {
    hostSettings.rounds = parseInt(document.getElementById('rounds-input').value) || 5;
    
    hostSettings.decades.clear();
    document.querySelectorAll('.decade-checkbox:checked').forEach(cb => {
        hostSettings.decades.add(cb.value);
    });
    
    hostSettings.genres.clear();
    document.querySelectorAll('.genre-checkbox:checked').forEach(cb => {
        hostSettings.genres.add(cb.value);
    });
    
    if (activeRoomCode) {
        socket.emit('update_game_settings', {
            room_code: activeRoomCode,
            rounds: hostSettings.rounds,
            decades: Array.from(hostSettings.decades),
            genres: Array.from(hostSettings.genres)
        });
    }
    
    closeSettings();
    alert('Settings saved!');
}

initializeSettingsUI();

function sanitizeRoomCode(rawValue) {
    return (rawValue || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 20);
}

function setHostRoom() {
    const input = document.getElementById('room-code-input');
    const cleanedRoomCode = sanitizeRoomCode(input.value);

    if (!cleanedRoomCode) {
        alert('Please enter a valid room code.');
        return;
    }

    activeRoomCode = cleanedRoomCode;
    input.value = cleanedRoomCode;

    const joinLink = `${baseJoinURL}/?room=${encodeURIComponent(activeRoomCode)}`;
    const joinLinkElement = document.getElementById('join-link');

    document.getElementById('active-room-code').innerText = activeRoomCode;
    joinLinkElement.href = joinLink;
    joinLinkElement.innerText = joinLink;

    qrCode.clear();
    qrCode.makeCode(joinLink);

    socket.emit('host_join', { room_code: activeRoomCode });
}

function startHostTimer(seconds) {
    if (hostCountdownInterval) {
        clearInterval(hostCountdownInterval);
    }

    let timeLeft = Number(seconds) || 0;
    const timerEl = document.getElementById('host-timer');
    timerEl.innerText = `Time Left: ${timeLeft}s`;

    hostCountdownInterval = setInterval(() => {
        timeLeft -= 1;
        timerEl.innerText = `Time Left: ${Math.max(0, timeLeft)}s`;

        if (timeLeft <= 0) {
            clearInterval(hostCountdownInterval);
            hostCountdownInterval = null;
        }
    }, 1000);
}

function clearHostRevealTimers() {
    hostRevealTimeouts.forEach(timerId => clearTimeout(timerId));
    hostRevealTimeouts = [];
}

function renderHostClues(clues, elapsedSeconds) {
    const elapsed = Math.max(0, Number(elapsedSeconds) || 0);
    const lyric2At = 15;
    const lyric1At = 45;

    document.getElementById('host-meta').innerText = `Genre: ${clues.genre_label || clues.genre} | Year: ${clues.year}`;
    document.getElementById('lyric3').innerText = clues.lyric3 ? `Lyric 3: "${clues.lyric3}"` : '';

    if (elapsed >= lyric2At) {
        document.getElementById('lyric2').innerText = clues.lyric2 ? `Lyric 2: "${clues.lyric2}"` : '';
    } else {
        document.getElementById('lyric2').innerText = '';
        hostRevealTimeouts.push(setTimeout(() => {
            document.getElementById('lyric2').innerText = clues.lyric2 ? `Lyric 2: "${clues.lyric2}"` : '';
        }, (lyric2At - elapsed) * 1000));
    }

    if (elapsed >= lyric1At) {
        document.getElementById('lyric1').innerText = clues.lyric1 ? `Lyric 1: "${clues.lyric1}"` : '';
    } else {
        document.getElementById('lyric1').innerText = '';
        hostRevealTimeouts.push(setTimeout(() => {
            document.getElementById('lyric1').innerText = clues.lyric1 ? `Lyric 1: "${clues.lyric1}"` : '';
        }, (lyric1At - elapsed) * 1000));
    }
}

// Centralized Phase Controller
function showView(activeViewId) {
    // Hide all main game views instantly
    document.querySelectorAll('.game-phase').forEach(view => {
        view.classList.add('hidden');
    });
    // Un-hide just the active one
    document.getElementById(activeViewId).classList.remove('hidden');
}

function startRound() {
    if (!activeRoomCode) {
        alert('Set a room code first.');
        return;
    }

    // Completely wipe out previous results DOM element tree and reset counters
    document.getElementById('results-view').innerHTML = '';
    document.getElementById('guessCount').innerText = 'Guesses: 0/0';
    document.getElementById('host-meta').innerText = '';
    document.getElementById('lyric3').innerText = '';
    document.getElementById('lyric2').innerText = '';
    document.getElementById('lyric1').innerText = '';
    clearHostRevealTimers();
    
    // Switch Views via central state switcher
    showView('game-view');
    
    // Manage control buttons state
    document.getElementById('btn-start').innerText = "Next Round";
    document.getElementById('btn-start').classList.add('hidden');
    document.getElementById('btn-results').classList.remove('hidden');

    socket.emit('start_round', { room_code: activeRoomCode });
}

function showResults() {
    document.getElementById('btn-results').classList.add('hidden');
    document.getElementById('btn-start').classList.remove('hidden');
    document.getElementById('btn-start').disabled = false;
    socket.emit('show_results', { room_code: activeRoomCode });
}

socket.on('host_error', (data) => {
    if (data && data.message) {
        alert(data.message);
    }
});

socket.on('host_room_joined', (data) => {
    activeRoomCode = data.room_code;
    document.getElementById('active-room-code').innerText = data.room_code;

    const list = document.getElementById('players');
    list.innerHTML = '';
    data.players.forEach(player => {
        const li = document.createElement('li');
        li.textContent = player;
        list.appendChild(li);
    });

    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-settings').disabled = false;
});

socket.on('settings_updated', (data) => {
    console.log('Settings updated on host screen');
});

socket.on('update_players', (data) => {
    const list = document.getElementById('players');
    list.innerHTML = '';

    data.players.forEach(player => {
        const li = document.createElement('li');
        li.textContent = player;
        list.appendChild(li);
    });

    document.getElementById('btn-start').disabled = false;
});

socket.on('host_round_started', (data) => {
    // Ensure host controls are in active-round mode.
    document.getElementById('btn-start').classList.add('hidden');
    document.getElementById('btn-results').classList.remove('hidden');
    document.getElementById('btn-results').disabled = false;

    clearHostRevealTimers();
    const totalTime = data.timing.total_time;
    const remainingTime = data.timing.remaining_time;
    const elapsed = Math.max(0, totalTime - remainingTime);

    renderHostClues(data.clues, elapsed);
    document.getElementById('guessCount').innerText = `Guesses: 0/${data.total_players}`;
    startHostTimer(remainingTime);
});

socket.on('guess_count', (data) => {
    document.getElementById('guessCount').innerText = `Guesses: ${data.count}/${data.total}`;
});

socket.on('game_state', (data) => {
    if (data.state === 'results') {
        if (hostCountdownInterval) {
            clearInterval(hostCountdownInterval);
            hostCountdownInterval = null;
        }
        document.getElementById('host-timer').innerText = 'Time Left: 0s';
    }
});

socket.on('round_results', (data) => {
    if (hostCountdownInterval) {
        clearInterval(hostCountdownInterval);
        hostCountdownInterval = null;
    }
    document.getElementById('host-timer').innerText = 'Time Left: 0s';

    const resultsDiv = document.getElementById('results-view');
    resultsDiv.innerHTML = '';

    // Round has ended, so return host controls to next-round mode.
    document.getElementById('btn-results').classList.add('hidden');
    const startBtn = document.getElementById('btn-start');
    startBtn.classList.remove('hidden');
    startBtn.disabled = false;
    startBtn.innerText = 'Start Round';
    
    // Force View Shift to Results Screen
    showView('results-view');

    const title = document.createElement('h2');
    title.style.color = "#1db954";
    title.innerText = `Answer: ${data.answer} by ${data.artist} (${data.year}, ${data.genre_label || data.genre})`;
    resultsDiv.appendChild(title);

    if (data.preview && data.preview.preview_url) {
        const audioTitle = document.createElement('p');
        audioTitle.innerHTML = `<strong>iTunes Preview:</strong> ${data.preview.track_name} - ${data.preview.artist_name}`;
        resultsDiv.appendChild(audioTitle);

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'auto';
        audio.src = data.preview.preview_url;
        audio.style.marginBottom = '16px';
        resultsDiv.appendChild(audio);

        audio.play().catch(() => {
            console.log('Autoplay blocked; using native controls for preview playback');
        });

        if (data.preview.candidates && data.preview.candidates.length > 1) {
            const altWrap = document.createElement('div');
            altWrap.style.marginBottom = '14px';
            altWrap.innerHTML = '<strong>Alternate Previews:</strong>';
            data.preview.candidates.slice(1).forEach((candidate) => {
                const link = document.createElement('a');
                link.href = candidate.preview_url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.style.display = 'block';
                link.style.color = '#1db954';
                link.innerText = `${candidate.track_name} - ${candidate.artist_name}`;
                altWrap.appendChild(link);
            });
            resultsDiv.appendChild(altWrap);
        }
    }

    data.results.forEach(result => {
        const div = document.createElement('div');
        div.className = 'result';
        div.innerHTML = `
            <h3>${result.player}</h3>
            <p><strong>Song Guess:</strong> ${result.title_guess || '[No Guess]'}</p>
            <p><strong>Artist Guess:</strong> ${result.artist_guess || '[No Guess]'}</p>
            <p><strong>Title Points:</strong> +${result.title_score}</p>
            <p><strong>Artist Points:</strong> +${result.artist_score} (${result.artist_match})</p>
            <p><strong>Both Correct Bonus:</strong> +${result.both_bonus}</p>
            <p><strong>Early Lock Bonus:</strong> +${result.early_lock_bonus}</p>
            <p><strong>Round Points:</strong> +${result.round_score}</p>
            <p><strong>Total Running Score:</strong> ${result.total_score}</p>
        `;
        resultsDiv.appendChild(div);
    });
});
</script>

</body>
</html>
