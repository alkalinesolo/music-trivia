<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Trivia Host</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='host.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='qrcode.min.js') }}"></script>
</head>
<body data-join-url="{{ join_url }}">

<h1>Music Trivia Host</h1>
<hr style="border-color: #333;">

<div id="lobby-view" class="game-phase">
    <h2>Host Room</h2>
    <div style="max-width: 460px; margin: 12px auto;">
        <input id="room-code-input" type="text" placeholder="Room code" maxlength="20" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1b1b1b; color: #fff;">
        <button onclick="setHostRoom()">Set Room</button>
    </div>

    <h2>Active Room: <span id="active-room-code" style="color: #1db954;">-</span></h2>
    <p>Join Link: <a id="join-link" href="#" target="_blank" rel="noopener noreferrer" style="color: #7ee5af;">Set room to generate link</a></p>
    <div id="qrcode"></div>

    <button id="btn-settings" onclick="openSettings()" disabled>Settings</button>

    <h2>Connected Players</h2>
    <ul id="players"></ul>
</div>

<div id="game-view" class="game-phase hidden">
    <h2 id="guessCount" style="color: #aaa;">Guesses: 0/0</h2>
    <h2 id="host-timer" style="color: #f4ca82;">Time Left: 0s</h2>
    <h3 id="host-meta" style="color: #c5d0dc;"></h3>
    <h1 id="lyric3"></h1>
    <h2 id="lyric2"></h2>
    <h3 id="lyric1"></h3>
</div>

<div id="results-view" class="game-phase hidden"></div>

<div id="controls" style="margin-top: 30px;">
    <button id="btn-start" onclick="startRound()" disabled>Start Round</button>
    <button id="btn-results" onclick="showResults()" class="hidden">Show Results</button>
</div>

<div style="margin-top: 16px; text-align: center;">
    <button onclick="leaderboardOpen()" style="background: none; border: none; color: #7ee5af; cursor: pointer; font-size: 0.9rem; text-decoration: underline; padding: 4px;">View Leaderboard</button>
</div>

<div id="settings-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);">
    <div style="max-width: 620px; margin: 6vh auto; background: #171717; border: 1px solid #333; border-radius: 12px; padding: 16px; text-align: left;">
        <h2 style="margin-top: 0;">Game Settings</h2>

        <label for="rounds-input"><strong>Rounds</strong></label>
        <input id="rounds-input" type="number" min="1" max="25" value="5" style="display: block; margin-top: 6px; width: 140px; padding: 8px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff;">

        <div style="margin-top: 12px;">
            <strong>Game Mode</strong>
            <label style="display:block; margin-top: 8px;"><input type="radio" id="game-mode-quick" name="game-mode" value="quick" checked> Quick (1 lyric, 30s)</label>
            <label style="display:block; margin-top: 6px;"><input type="radio" id="game-mode-full" name="game-mode" value="full"> Full (45s, reveals at 30s and 15s left)</label>
            <label style="display:block; margin-top: 6px;"><input type="radio" id="game-mode-music-only" name="game-mode" value="music_only"> Music Only (30s preview)</label>
        </div>

        <div style="display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 12px;">
            <div>
                <strong>Decades</strong>
                <div id="decades-container" style="margin-top: 8px; display: grid; gap: 8px;"></div>
            </div>
            <div>
                <strong>Genres</strong>
                <div id="genres-container" style="margin-top: 8px; display: grid; gap: 8px;"></div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end;">
            <button onclick="closeSettings()" style="background: #3a3a3a;">Cancel</button>
            <button onclick="saveSettings()">Save Settings</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='host.core.js') }}"></script>
<script src="{{ url_for('static', filename='host.socket.js') }}"></script>
<script>
    function leaderboardRoomCode() { return activeRoomCode || ''; }
</script>
<script src="{{ url_for('static', filename='leaderboard.js') }}"></script>

</body>
</html>
