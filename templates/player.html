<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Trivia Player</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            color: #1db954;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #222;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input[type="text"]:disabled {
            background: #1a1a1a;
            color: #777;
            border-color: #222;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: #1db954;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        .phase-view {
            background: #1c1c1c;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .lyric-box {
            font-size: 20px;
            font-style: italic;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .status-message {
            font-size: 18px;
            color: #b3b3b3;
            margin-top: 15px;
        }

        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: #1db954;
            margin: 15px 0;
        }

        /* Live Visual Timer Interface */
        .timer-badge {
            font-size: 18px;
            font-weight: bold;
            background: #282828;
            border: 2px solid #1db954;
            color: #1db954;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            margin-top: 12px;
        }

        .timer-warning {
            border-color: #ff5555 !important;
            color: #ff5555 !important;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 Mobile Controller</h1>
    <h3>Player: <span style="color: #1db954;">{{ name }}</span></h3>
    <h3>Room: <span style="color: #1db954;">{{ room_code }}</span></h3>
    <hr style="border-color: #252525;">

    <!-- ========================= -->
    <!-- LOBBY VIEW                -->
    <!-- ========================= -->
    <div id="lobby-view" class="phase-view">
        <h2>Joined Lobby!</h2>
        <p class="status-message">Hang tight. The round will begin as soon as the host starts the game on the main screen.</p>
    </div>

    <!-- ========================= -->
    <!-- GUESSING VIEW             -->
    <!-- ========================= -->
    <div id="guessing-view" class="phase-view hidden">
        <div class="lyric-box" id="player-lyric"></div>
        
        <div id="input-area">
            <input type="text" id="player-title-guess" placeholder="Song title..." autocomplete="off">
            <input type="text" id="player-artist-guess" placeholder="Artist name..." autocomplete="off">
            <button id="btn-submit" onclick="submitGuess()">Lock In Guess</button>
            <div id="timer-display" class="timer-badge">Time Left: --</div>
        </div>
        
        <div id="lock-status" class="status-message hidden">
            🔒 Guess submitted! Waiting for the timer to expire or other players to finish...
        </div>
    </div>

    <!-- ========================= -->
    <!-- RESULTS VIEW              -->
    <!-- ========================= -->
    <div id="results-view" class="phase-view hidden">
        <h2>Round Ended</h2>
        <div id="personal-feedback"></div>
    </div>
</div>

<script>
const socket = io();

// Fix 1: Normalize name parameters globally to safeguard string match routines
const playerNameRaw = "{{ name }}";
const playerNameNormalized = playerNameRaw.trim().toLowerCase();
const playerRoomCode = "{{ room_code }}";

let countdownInterval = null;

// Announce presence to the backend socket network
socket.emit('player_join', { name: playerNameRaw, room_code: playerRoomCode });

function changeView(activeViewId) {
    document.querySelectorAll('.phase-view').forEach(view => {
        view.classList.add('hidden');
    });
    document.getElementById(activeViewId).classList.remove('hidden');
}

function startUiTimer(seconds) {
    // Clear any dangling interval instances safely
    if (countdownInterval) clearInterval(countdownInterval);
    
    let timeLeft = seconds;
    const timerEl = document.getElementById("timer-display");
    
    timerEl.innerText = `Time Left: ${timeLeft}s`;
    timerEl.classList.remove("timer-warning");

    countdownInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = `Time Left: ${Math.max(0, timeLeft)}s`;

        if (timeLeft <= 5) {
            timerEl.classList.add("timer-warning");
        }

        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
        }
    }, 1000);
}

function submitGuess() {
    const titleInput = document.getElementById('player-title-guess');
    const artistInput = document.getElementById('player-artist-guess');
    const titleGuessValue = titleInput.value.trim();
    const artistGuessValue = artistInput.value.trim();
    
    if (!titleGuessValue && !artistGuessValue) return;

    // Immediately lock controls to prevent multi-tap submission spikes
    titleInput.disabled = true;
    artistInput.disabled = true;
    document.getElementById('btn-submit').disabled = true;
    document.getElementById('input-area').classList.add('hidden');
    document.getElementById('lock-status').classList.remove('hidden');

    socket.emit('submit_guess', {
        name: playerNameRaw,
        room_code: playerRoomCode,
        title_guess: titleGuessValue,
        artist_guess: artistGuessValue
    });
}

// Global engine state coordinator subscription
socket.on('game_state', (data) => {
    if (data.state === 'guessing') {
        // Fix 5: Clean old result text elements instantly to clear visual ghosting
        document.getElementById('personal-feedback').innerHTML = '';
        
        document.getElementById('player-title-guess').disabled = false;
        document.getElementById('player-artist-guess').disabled = false;
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('input-area').classList.remove('hidden');
        document.getElementById('lock-status').classList.add('hidden');
        changeView('guessing-view');
    } else if (data.state === 'results') {
        if (countdownInterval) clearInterval(countdownInterval);
        changeView('results-view');
    } else if (data.state === 'lobby') {
        // Fix 2: Handle explicit session resets down to baseline lobby
        if (countdownInterval) clearInterval(countdownInterval);
        changeView('lobby-view');
    }
});

// Fix 3: Standardize text input wiping and state unlocking within the round creation hook
socket.on('new_round', (data) => {
    document.getElementById('player-lyric').innerText = `"${data.lyric}"`;
    
    const titleInput = document.getElementById('player-title-guess');
    const artistInput = document.getElementById('player-artist-guess');
    titleInput.value = '';
    artistInput.value = '';
    titleInput.disabled = false;
    artistInput.disabled = false;

    if (data && data.time !== undefined) {
        startUiTimer(data.time);
    }
});

socket.on('round_results', (data) => {
    const feedbackDiv = document.getElementById('personal-feedback');
    feedbackDiv.innerHTML = '';

    // Fix 1 Mapping Verification: Match objects safely using the standardized key mapping formula
    const myResult = data.results.find(r => r.player.trim().toLowerCase() === playerNameNormalized);

    if (myResult) {
        const scoreHeader = document.createElement('div');
        
        if (myResult.no_guess) {
            scoreHeader.innerHTML = `
                <p class="status-message" style="color: #ff5555;">Time ran out before you guessed!</p>
                <div class="score-display" style="color: #ff5555;">+0</div>
            `;
        } else {
            scoreHeader.innerHTML = `
                <p class="status-message">Song guess: <strong>${myResult.title_guess || '[No Guess]'}</strong> (${myResult.title_correct ? 'Correct' : 'Incorrect'})</p>
                <p class="status-message">Artist guess: <strong>${myResult.artist_guess || '[No Guess]'}</strong> (${myResult.artist_correct ? 'Correct' : 'Incorrect'})</p>
                <p class="status-message">Round Score:</p>
                <div class="score-display">+${myResult.round_score}</div>
            `;
        }
        
        const runningTotal = document.createElement('p');
        runningTotal.className = 'status-message';
        runningTotal.innerHTML = `Your Running Total: <strong>${myResult.total_score} pts</strong>`;
        
        feedbackDiv.appendChild(scoreHeader);
        feedbackDiv.appendChild(runningTotal);
    }
});
</script>

</body>
</html>
