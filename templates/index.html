<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Trivia</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            margin-top: 80px;
        }

        h1 {
            color: #1db954;
            margin-bottom: 10px;
        }

        p {
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #222;
            outline: none;
            margin-bottom: 15px;
            background: #222;
            color: white;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        /* Provide visual focus indicators */
        input[type="text"]:focus {
            border-color: #1db954;
            background: #2a2a2a;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #1db954;
            color: white;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background: #17a64a;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #444;
            letter-spacing: 0.5px;
        }

        .host-link {
            margin-top: 14px;
            display: block;
            color: #1db954;
            text-decoration: none;
            font-weight: 600;
        }

        .host-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Music Trivia</h1>
    <p>Enter your name to join the game session</p>

    <form action="/join" method="POST" onsubmit="return validateForm()">
        <input 
            type="text" 
            id="join-name"
            name="name" 
            placeholder="Your name..." 
            required
            autocomplete="off"
            maxlength="15"
        >
        <button type="submit">Join Game</button>
    </form>

    <a class="host-link" href="/host">Hosting on a TV? Open Host Screen</a>

    <div class="footer">
        Powered by Flask + SocketIO Engine
    </div>
</div>

<script>
function validateForm() {
    const nameInput = document.getElementById('join-name');
    const cleanedName = nameInput.value.trim();
    
    // Explicitly reject purely whitespace submissions before they hit server sockets
    if (!cleanedName) {
        alert("Please enter a valid name.");
        nameInput.value = "";
        return false;
    }
    
    // Update value to the cleaned version right before dispatching the POST redirect
    nameInput.value = cleanedName;
    return true;
}
</script>

</body>
</html>
